<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Học Kỳ Thú - Khang & Khánh</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vio': '#28B463', // Màu xanh VioEdu đặc trưng
                        'vio-dark': '#1D8348',
                        'vio-light': '#D5F5E3',
                        'kid-orange': '#FF7F50',
                        'kid-blue': '#3498DB',
                        'kid-pink': '#FF6B81',
                        'kid-yellow': '#F1C40F',
                        'kid-purple': '#9B59B6',
                        'cloud-bg': '#E8F8F5'
                    },
                    boxShadow: {
                        'cartoon': '0 8px 0px #1D8348',
                        'cartoon-orange': '0 8px 0px #D35400',
                        'cartoon-blue': '0 8px 0px #21618C',
                        'cartoon-pink': '0 8px 0px #C0392B',
                        'cartoon-yellow': '0 8px 0px #B7950B',
                        'card-3d': '0 12px 24px -4px rgba(0,0,0,0.15), 0 4px 20px 0 rgba(0,0,0,0.1)',
                        'inner-soft': 'inset 0 4px 6px rgba(0,0,0,0.06)'
                    },
                    fontFamily: {
                        'fredoka': ['Fredoka', 'sans-serif'],
                        'sans': ['Quicksand', 'sans-serif'],
                    }
                }
            }
        };
    </script>

    <!-- Custom Game CSS -->
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: radial-gradient(circle, #E8F8F5 0%, #A2D9CE 100%); 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
        }
        .btn-cartoon-click:active { 
            transform: translateY(4px); 
            box-shadow: 0 4px 0px currentColor !important;
        }
        
        /* Hiệu ứng rung khi chọn sai */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-3deg); }
            75% { transform: translateX(8px) rotate(3deg); }
        }
        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        /* Hiệu ứng bay bổng của bong bóng */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: floatUp 10s infinite linear;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (để biên dịch JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="relative min-h-screen">

    <!-- Các bong bóng bay làm nền vui nhộn -->
    <div class="bubble" style="width: 40px; height: 40px; left: 5%; animation-delay: 0s; animation-duration: 12s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; left: 15%; animation-delay: 2s; animation-duration: 16s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 75%; animation-delay: 1s; animation-duration: 14s;"></div>
    <div class="bubble" style="width: 90px; height: 90px; left: 85%; animation-delay: 4s; animation-duration: 18s;"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Tạo câu hỏi toán học sáng tạo
        const generateQuestionForLevel = (level) => {
            let num1, num2, answer, operator;
            let isDivision = false;

            // Phân bổ độ khó:
            if (level <= 15) { // Phép nhân từ 1 đến 9, nhân với 0
                operator = '×';
                if (level <= 3) { num1 = randomInt(1, 3); num2 = randomInt(0, 10); } 
                else if (level <= 6) { num1 = randomInt(4, 5); num2 = randomInt(0, 10); }
                else if (level <= 10) { num1 = randomInt(6, 7); num2 = randomInt(0, 10); }
                else if (level <= 13) { num1 = randomInt(8, 9); num2 = randomInt(0, 10); }
                else { num1 = randomInt(1, 9); num2 = randomInt(0, 10); } 
                answer = num1 * num2;
            } else if (level <= 25) { // Phép chia từ dễ đến khó
                isDivision = true;
                operator = ':';
                let divisor;
                if (level <= 18) { divisor = randomInt(1, 3); }
                else if (level <= 21) { divisor = randomInt(4, 5); }
                else if (level <= 23) { divisor = randomInt(6, 7); }
                else { divisor = randomInt(8, 9); }
                
                let quotient = randomInt(1, 10);
                num1 = divisor * quotient; 
                num2 = divisor;
                answer = quotient;
            } else { // Trận đấu trùm: Hỗn hợp nhân chia ngẫu nhiên
                isDivision = Math.random() > 0.5;
                if (isDivision) {
                    operator = ':';
                    let divisor = randomInt(1, 9);
                    let quotient = randomInt(1, 10);
                    num1 = divisor * quotient;
                    num2 = divisor;
                    answer = quotient;
                } else {
                    operator = '×';
                    num1 = randomInt(1, 9);
                    num2 = randomInt(0, 10);
                    answer = num1 * num2;
                }
            }

            // Tạo các đáp án gây nhiễu hợp lý
            let options = new Set([answer]);
            while(options.size < 4) {
                let wrongAns;
                if (isDivision) {
                    wrongAns = answer + randomInt(-3, 3);
                    if (wrongAns < 1) wrongAns = randomInt(1, 10);
                } else {
                    const errorType = randomInt(1, 3);
                    if (errorType === 1) wrongAns = answer + num1;
                    else if (errorType === 2) wrongAns = answer - num1;
                    else wrongAns = answer + randomInt(-5, 5);
                }
                
                if (wrongAns >= 0 && wrongAns !== answer) {
                    options.add(wrongAns);
                }
            }

            return {
                num1, num2, operator, answer,
                options: Array.from(options).sort(() => Math.random() - 0.5)
            };
        };

        // Công cụ phát âm thanh động (bằng Web Audio API cho mượt mà, không phụ thuộc file ngoài)
        const playSynthSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                if (type === 'correct') {
                    // Tiếng tinh tinh vui vẻ
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'wrong') {
                    // Tiếng xịt ngộ nghĩnh
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.linearRampToValueAtTime(110, now + 0.3); // Giảm tần số nhanh

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    // Tiếng 'pop' nút
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) { console.log("Sound failed: ", e); }
        };

        // TTS đọc tiếng Việt chuẩn
        const speakText = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance();
                msg.text = text;
                msg.lang = 'vi-VN';
                msg.rate = 0.85; // Đọc chậm rãi vừa nghe cho bé
                
                // Cố gắng tìm giọng đọc nữ/nam tiếng Việt
                const voices = window.speechSynthesis.getVoices();
                const viVoice = voices.find(voice => voice.lang.includes('vi') || voice.lang.includes('VI'));
                if (viVoice) msg.voice = viVoice;

                window.speechSynthesis.speak(msg);
            }
        };

        // COMPONENT: Bé tự học bảng cửu chương
        const SelfStudy = () => {
            const [mode, setMode] = useState('nhan'); 
            const [number, setNumber] = useState(2); 
            const [speakingId, setSpeakingId] = useState(null);

            // Tự động nạp lại giọng nói phòng hờ trình duyệt chưa load kịp
            useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.onvoiceschanged = () => {};
                }
            }, []);

            const tableData = [];
            const startIdx = mode === 'nhan' ? 0 : 1; 
            
            for (let i = startIdx; i <= 10; i++) {
                if (mode === 'nhan') {
                    tableData.push({
                        id: i,
                        equation: `${number} × ${i} = ${number * i}`,
                        readText: `${number} nhân ${i} bằng ${number * i}`
                    });
                } else {
                    const dividend = number * i;
                    tableData.push({
                        id: i,
                        equation: `${dividend} : ${number} = ${i}`,
                        readText: `${dividend} chia ${number} bằng ${i}`
                    });
                }
            }

            const handleRead = (item) => {
                playSynthSound('click');
                setSpeakingId(item.id);
                speakText(item.readText);
                setTimeout(() => setSpeakingId(null), 1800);
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-[2.5rem] p-6 md:p-10 shadow-card-3d border-8 border-vio-light relative">
                    {/* Cute Banner */}
                    <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-kid-yellow text-amber-950 font-black px-8 py-3 rounded-full shadow-md text-lg tracking-wider border-4 border-white whitespace-nowrap">
                        📚 BÉ TỰ HỌC KHÉO TAY
                    </div>

                    <div className="text-center mt-6 mb-8">
                        <h2 className="text-3xl md:text-5xl font-black text-vio-dark font-fredoka tracking-wide mb-3">Lớp Học Ếch Xanh 🐸</h2>
                        <p className="text-gray-500 font-bold text-lg">Khang & Khánh chọn một bảng cửu chương bên dưới để đọc vang nhé!</p>
                    </div>

                    {/* Chọn Chế Độ: Nhân hay Chia */}
                    <div className="flex justify-center gap-6 mb-8">
                        <button 
                            onClick={() => { playSynthSound('click'); setMode('nhan'); }}
                            className={`px-8 py-4 rounded-3xl font-black text-xl transition-all duration-300 transform hover:scale-105 btn-cartoon-click
                                ${mode === 'nhan' 
                                    ? 'bg-kid-orange text-white shadow-cartoon-orange border-2 border-orange-600' 
                                    : 'bg-orange-50 text-orange-500 hover:bg-orange-100 border-2 border-orange-200'}`}
                            style={{ color: mode === 'nhan' ? '#fff' : '#FF7F50' }}
                        >
                            Phép Nhân (×)
                        </button>
                        <button 
                            onClick={() => { playSynthSound('click'); setMode('chia'); }}
                            className={`px-8 py-4 rounded-3xl font-black text-xl transition-all duration-300 transform hover:scale-105 btn-cartoon-click
                                ${mode === 'chia' 
                                    ? 'bg-kid-blue text-white shadow-cartoon-blue border-2 border-blue-600' 
                                    : 'bg-blue-50 text-blue-500 hover:bg-blue-100 border-2 border-blue-200'}`}
                            style={{ color: mode === 'chia' ? '#fff' : '#3498DB' }}
                        >
                            Phép Chia (:)
                        </button>
                    </div>

                    {/* Thanh Chọn Số từ 1-9 siêu sinh động */}
                    <div className="bg-emerald-50 rounded-[2rem] p-4 border-4 border-emerald-100 flex flex-wrap justify-center gap-3 md:gap-4 mb-10 shadow-inner-soft">
                        {[1,2,3,4,5,6,7,8,9].map(num => (
                            <button
                                key={num}
                                onClick={() => { playSynthSound('click'); setNumber(num); }}
                                className={`w-14 h-14 md:w-18 md:h-18 rounded-full font-black text-2xl md:text-3xl btn-cartoon-click flex items-center justify-center transition-all duration-300
                                    ${number === num 
                                        ? 'bg-vio text-white shadow-cartoon scale-110 border-2 border-emerald-700' 
                                        : 'bg-white text-vio-dark hover:bg-emerald-100 border-4 border-emerald-100'}`}
                                style={{ color: number === num ? '#fff' : '#1D8348' }}
                            >
                                {num}
                            </button>
                        ))}
                    </div>

                    {/* Hiển thị bảng tính toán */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {tableData.map((item) => (
                            <div 
                                key={item.id} 
                                className={`flex items-center justify-between p-5 rounded-[1.8rem] border-4 transition-all duration-300
                                    ${speakingId === item.id 
                                        ? 'border-vio bg-vio-light scale-105 shadow-md translate-x-2' 
                                        : 'border-slate-100 bg-slate-50 hover:bg-white hover:border-emerald-200 hover:shadow-md'}`}
                            >
                                <span className="text-3xl font-black text-gray-700 tracking-wider font-qs">
                                    {item.equation}
                                </span>
                                <button 
                                    onClick={() => handleRead(item)}
                                    className="bg-kid-yellow hover:bg-yellow-400 text-yellow-950 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl btn-cartoon-click shadow-cartoon-yellow border-2 border-yellow-600 transition-colors"
                                    title="Nhấp để nghe đọc"
                                >
                                    🔊
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // COMPONENT: Màn chơi thử thách thực tế
        const PlayMission = ({ level, onBack, onComplete }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedAns, setSelectedAns] = useState(null);
            const [ansStatus, setAnsStatus] = useState(null); // 'correct' or 'wrong'
            const [score, setScore] = useState(0);
            const [isFinished, setIsFinished] = useState(false);
            const [frogMessage, setFrogMessage] = useState("Khang và Khánh ơi, cố lên nhé! Câu này siêu dễ!");

            useEffect(() => {
                const qs = [];
                for (let i = 0; i < 5; i++) qs.push(generateQuestionForLevel(level));
                setQuestions(qs);
                setFrogMessage(getRandomEncouragement());
            }, [level]);

            const getRandomEncouragement = () => {
                const messages = [
                    "Khang ơi, làm loáng một cái là xong nè!",
                    "Khánh ơi, nhìn thật kỹ các con số nhé!",
                    "Siêu nhân Designer đang cổ vũ hai bé đó!",
                    "Quá siêu luôn! Thêm một ngôi sao vàng nào!",
                    "Đúng là thần đồng toán học Khang Khánh!",
                ];
                return messages[randomInt(0, messages.length - 1)];
            };

            const handleAnswer = (ans) => {
                if (ansStatus === 'correct') return; // Tránh bấm liên tục

                setSelectedAns(ans);
                const isCorrect = ans === questions[currentQ].answer;
                
                if (isCorrect) {
                    setAnsStatus('correct');
                    playSynthSound('correct');
                    setTimeout(() => {
                        const newScore = score + 1;
                        setScore(newScore);
                        if (currentQ < 4) {
                            setCurrentQ(c => c + 1);
                            setFrogMessage(getRandomEncouragement());
                        } else {
                            setIsFinished(true);
                        }
                        setAnsStatus(null);
                        setSelectedAns(null);
                    }, 1200);
                } else {
                    setAnsStatus('wrong');
                    playSynthSound('wrong');
                    setFrogMessage("Ôi! Sai mất rồi! Bé hãy chọn lại lần nữa nhé!");
                    // Cho phép thử lại bằng cách reset sau một khoảng ngắn
                    setTimeout(() => {
                        setAnsStatus(null);
                        setSelectedAns(null);
                    }, 1000);
                }
            };

            if (questions.length === 0) return null;

            if (isFinished) {
                return (
                    <div className="flex flex-col items-center justify-center py-10 px-4">
                        <div className="bg-white rounded-[3rem] p-8 md:p-12 shadow-card-3d text-center border-8 border-green-400 max-w-lg w-full relative">
                            {/* Confetti decoration */}
                            <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 text-8xl animate-bounce">🏆</div>
                            
                            <h2 className="text-4xl md:text-5xl font-black text-green-600 mt-6 mb-4 font-fredoka">QUÁ XUẤT SẮC! 🎉</h2>
                            
                            <div className="bg-emerald-50 rounded-2xl p-6 mb-8 border-2 border-emerald-100">
                                <p className="text-2xl font-black text-emerald-800 mb-2">⭐ ⭐ ⭐ ⭐ ⭐</p>
                                <p className="text-xl font-bold text-gray-700">Nguyên Khang & Hoàng Khánh đã chinh phục xuất sắc Nhiệm vụ {level}!</p>
                            </div>

                            <button 
                                onClick={() => onComplete(level, score)}
                                className="bg-green-500 hover:bg-green-600 text-white px-10 py-5 rounded-2xl font-black text-2xl btn-cartoon-click shadow-cartoon w-full border-2 border-green-700 transition-colors"
                                style={{ color: '#fff' }}
                            >
                                TRỞ VỀ BẢN ĐỒ 🗺️
                            </button>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="flex flex-col items-center max-w-3xl mx-auto w-full px-2">
                    {/* Header nhiệm vụ */}
                    <div className="w-full flex justify-between items-center mb-6">
                        <button 
                            onClick={() => { playSynthSound('click'); onBack(); }} 
                            className="bg-white hover:bg-gray-100 text-gray-700 px-5 py-3 rounded-2xl font-black btn-cartoon-click border-4 border-slate-200 transition-colors text-base flex items-center gap-2"
                        >
                            <span>⬅</span> Rút lui
                        </button>
                        
                        <div className="bg-white border-4 border-vio-light px-6 py-2 rounded-full shadow-sm flex items-center gap-2">
                            <span className="text-2xl">🎖️</span>
                            <span className="text-xl font-black text-vio-dark">Nhiệm vụ {level}</span>
                        </div>

                        <div className="text-lg font-black bg-kid-orange text-white px-5 py-2.5 rounded-2xl border-2 border-orange-600 shadow-cartoon-orange">
                            Câu {currentQ + 1}/5
                        </div>
                    </div>

                    {/* Nhân vật Ếch Greenie hướng dẫn dễ thương */}
                    <div className="flex items-center gap-4 bg-white/95 rounded-[2rem] p-5 mb-6 border-4 border-emerald-100 shadow-md w-full relative">
                        <div className="text-5xl">🐸</div>
                        <div className="flex-1">
                            <h4 className="text-sm font-black text-vio-dark">Ếch Greenie hướng dẫn:</h4>
                            <p className="text-lg font-bold text-gray-700 leading-tight">{frogMessage}</p>
                        </div>
                    </div>

                    {/* Bảng câu hỏi khổng lồ */}
                    <div className="bg-white w-full rounded-[2.5rem] p-10 md:p-14 shadow-card-3d mb-8 text-center border-8 border-vio-light relative">
                        <div className="text-7xl md:text-9xl font-black text-vio-dark tracking-wide font-qs animate-pulse">
                            {q.num1} {q.operator} {q.num2} = ?
                        </div>
                    </div>

                    {/* Khung đáp án */}
                    <div className="grid grid-cols-2 gap-4 md:gap-6 w-full">
                        {q.options.map((opt, idx) => {
                            let btnBg = "bg-white text-vio-dark border-4 border-slate-200 hover:border-vio hover:bg-vio-light";
                            let shadowColor = "0 8px 0px rgba(0,0,0,0.1)";
                            let extraClass = "";

                            if (selectedAns === opt) {
                                if (ansStatus === 'correct') {
                                    btnBg = "bg-green-500 text-white border-green-600";
                                    shadowColor = "0 8px 0px #16a34a";
                                    extraClass = "scale-105";
                                } else if (ansStatus === 'wrong') {
                                    btnBg = "bg-red-500 text-white border-red-600";
                                    shadowColor = "0 8px 0px #b91c1c";
                                    extraClass = "shake-effect";
                                }
                            }

                            return (
                                <button 
                                    key={idx}
                                    onClick={() => handleAnswer(opt)}
                                    className={`text-5xl md:text-6xl font-black py-6 md:py-8 rounded-3xl transition-all btn-cartoon-click font-qs ${btnBg} ${extraClass}`}
                                    style={{ boxShadow: shadowColor }}
                                    disabled={ansStatus === 'correct'} 
                                >
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // COMPONENT: Bản đồ phiêu lưu
        const ChallengeMap = () => {
            const [playingLevel, setPlayingLevel] = useState(null);
            const [progress, setProgress] = useState(() => {
                try {
                    const saved = localStorage.getItem('khang_khanh_math_progress_v2');
                    return saved ? JSON.parse(saved) : { completed: [] };
                } catch(e) { return { completed: [] }; }
            });

            const handleComplete = (level) => {
                const newProg = { ...progress };
                if (!newProg.completed.includes(level)) {
                    newProg.completed.push(level);
                }
                setProgress(newProg);
                localStorage.setItem('khang_khanh_math_progress_v2', JSON.stringify(newProg));
                setPlayingLevel(null);
            };

            // Chia 30 levels ra thành 3 vùng đất tuyệt vời
            const regions = [
                {
                    title: "🪵 Thung Lũng Phép Nhân (Nhiệm vụ 1-15)",
                    desc: "Cùng làm quen phép nhân từ 0 đến 9 nào!",
                    levels: Array.from({length: 15}, (_, i) => i + 1),
                    color: "border-orange-200 bg-orange-50/50 text-orange-800"
                },
                {
                    title: "🏝️ Đảo Ngọc Phép Chia (Nhiệm vụ 16-25)",
                    desc: "Học các phép chia thần tốc siêu thú vị!",
                    levels: Array.from({length: 10}, (_, i) => i + 16),
                    color: "border-blue-200 bg-blue-50/50 text-blue-800"
                },
                {
                    title: "🌋 Núi Lửa Boss Hỗn Hợp (Nhiệm vụ 26-30)",
                    desc: "Thử tài tính nhanh đỉnh cao để thắng Boss!",
                    levels: Array.from({length: 5}, (_, i) => i + 26),
                    color: "border-purple-200 bg-purple-50/50 text-purple-800"
                }
            ];

            if (playingLevel) {
                return <PlayMission level={playingLevel} onBack={() => setPlayingLevel(null)} onComplete={handleComplete} />;
            }

            return (
                <div className="max-w-5xl mx-auto pb-10 px-2 animate-[fadeIn_0.5s_ease_out]">
                    
                    {/* Welcome Banner */}
                    <div className="bg-white rounded-[2.5rem] p-6 md:p-8 shadow-card-3d border-8 border-vio-light text-center mb-8 relative">
                        <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-kid-pink text-white font-black px-6 py-2 rounded-full shadow-md text-base border-4 border-white">
                            Chào Khang & Khánh! 🚀
                        </div>
                        <h2 className="text-3xl md:text-5xl font-black text-vio-dark font-fredoka tracking-wide mt-3 mb-2">Bản Đồ Thử Thách Kỳ Thú</h2>
                        <p className="text-gray-600 font-bold text-lg">Hai chiến binh chọn bất kỳ màn chơi nào bên dưới để khám phá kho báu nhé!</p>
                        
                        {/* Tiến trình tổng quan */}
                        <div className="mt-4 inline-flex items-center gap-3 bg-emerald-50 px-6 py-2 rounded-full border-2 border-emerald-200">
                            <span className="text-2xl">🏆</span>
                            <span className="font-black text-vio-dark text-lg">Đã thắng: {progress.completed.length}/30 màn</span>
                        </div>
                    </div>

                    {/* Danh sách các Vùng Đất */}
                    <div className="space-y-8">
                        {regions.map((region, rIdx) => (
                            <div key={rIdx} className={`rounded-[2.2rem] p-6 md:p-8 border-4 shadow-md ${region.color}`}>
                                <div className="mb-4">
                                    <h3 className="text-2xl md:text-3xl font-black font-fredoka">{region.title}</h3>
                                    <p className="font-bold opacity-80">{region.desc}</p>
                                </div>

                                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">
                                    {region.levels.map(level => {
                                        const isCompleted = progress.completed.includes(level);
                                        
                                        return (
                                            <button 
                                                key={level}
                                                onClick={() => { playSynthSound('click'); setPlayingLevel(level); }}
                                                className={`relative w-full aspect-square rounded-[1.8rem] flex flex-col items-center justify-center font-black text-3xl md:text-4xl btn-cartoon-click transition-all duration-300 font-qs border-b-8
                                                    ${isCompleted 
                                                        ? 'bg-green-500 text-white border-green-700 hover:bg-green-600' 
                                                        : 'bg-white text-slate-700 border-slate-300 hover:border-vio hover:bg-emerald-50 hover:-translate-y-1'}`}
                                                style={{ borderBottomWidth: '8px' }}
                                            >
                                                {level}
                                                {isCompleted && (
                                                    <div className="absolute -top-3 -right-3 text-3xl filter drop-shadow-md animate-bounce">⭐</div>
                                                )}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // MAIN APP
        const App = () => {
            const [activeTab, setActiveTab] = useState('study'); 

            const switchTab = (tab) => {
                playSynthSound('click');
                setActiveTab(tab);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header rực rỡ phong cách VioEdu */}
                    <header className="bg-white py-4 md:py-6 shadow-[0_6px_0_rgba(40,180,99,0.15)] px-4 mb-8 sticky top-0 z-20 border-b-4 border-vio-light">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            
                            {/* Logo */}
                            <h1 className="text-2xl md:text-4xl font-black text-vio flex items-center gap-2 tracking-wide font-fredoka cursor-pointer select-none">
                                <span className="text-4xl animate-bounce">🐸</span> 
                                TOÁN KÝ THÚ KHANG & KHÁNH
                            </h1>

                            {/* Menu Điều Hướng */}
                            <div className="flex bg-slate-100 p-2 rounded-[2rem] w-full md:w-auto shadow-inner-soft border-2 border-slate-200">
                                <button 
                                    onClick={() => switchTab('study')}
                                    className={`flex-1 md:flex-none px-8 py-3 rounded-full font-black transition-all text-base md:text-lg flex items-center justify-center gap-2
                                        ${activeTab === 'study' 
                                            ? 'bg-vio text-white shadow-md scale-105 border-2 border-emerald-600' 
                                            : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    <span>📖</span> Bé Tự Học
                                </button>
                                <button 
                                    onClick={() => switchTab('challenge')}
                                    className={`flex-1 md:flex-none px-8 py-3 rounded-full font-black transition-all text-base md:text-lg flex items-center justify-center gap-2
                                        ${activeTab === 'challenge' 
                                            ? 'bg-kid-orange text-white shadow-md scale-105 border-2 border-orange-600' 
                                            : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    <span>🗺️</span> Thử Thách (30)
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Vùng nội dung chơi */}
                    <main className="flex-grow px-4 pb-28">
                        {activeTab === 'study' ? <SelfStudy /> : <ChallengeMap />}
                    </main>

                    {/* Footer với bản quyền theo đúng yêu cầu */}
                    <footer className="fixed bottom-0 left-0 w-full bg-white/95 py-3 md:py-4 text-center text-slate-500 font-extrabold text-xs md:text-sm border-t-4 border-vio-light shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-10 font-qs">
                        © 2019 - 2026 Copyright by Siêu Nhân Designer
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
