<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Toán Cùng Khang & Khánh</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Quicksand for a playful, kid-friendly look -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        vio: {
                            light: '#e0fbf1',
                            DEFAULT: '#059669', // Emerald 600
                            dark: '#047857',
                        },
                        kid: {
                            pink: '#f472b6',
                            blue: '#38bdf8',
                            yellow: '#fbbf24',
                            orange: '#fb923c'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
                        'btn': '0 4px 0 0 rgba(0,0,0,0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0fdf4; /* Light green background */
            background-image: radial-gradient(#d1fae5 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Quicksand', sans-serif;
            touch-action: manipulation; /* Prevent double-tap zoom on iPad */
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-push {
            transition: all 0.1s;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.2);
        }

        /* Custom Scrollbar for map */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .map-bg {
            background: linear-gradient(180deg, #bbf7d0 0%, #86efac 100%);
            border-radius: 24px;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 30px;
            background: #ffd300;
            top: -20px;
            opacity: 0;
            animation: fall 3s ease-in-out infinite;
        }
        @keyframes fall {
            0% { opacity: 1; top: -10%; transform: translateX(0) rotate(0deg); }
            100% { opacity: 0; top: 110%; transform: translateX(20px) rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Root container for React -->
    <div id="root" class="flex-grow flex flex-col"></div>

    <!-- Footer -->
    <footer class="bg-white/80 backdrop-blur-sm py-4 text-center text-gray-500 font-semibold text-sm border-t border-green-200 mt-auto">
        &copy; 2019 - 2026 Copyright by Siêu Nhân Designer
    </footer>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- HELPER FUNCTIONS ---
        // Text to Speech for Reading Tables
        const speakText = (text) => {
            if ('speechSynthesis' in window) {
                // Cancel previous speech
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.8; // Slightly slower for kids
                utterance.pitch = 1.2; // Slightly higher pitch
                window.speechSynthesis.speak(utterance);
            }
        };

        const playSound = (type) => {
            // Placeholder for actual audio objects. 
            // In a real app, use Audio API with actual sound files.
            // Keeping it visual for this iteration to avoid cross-origin audio issues.
        };

        // Random integer between min and max (inclusive)
        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);

        // Generate Math Question based on Level (1-30)
        const generateQuestionForLevel = (level) => {
            let num1, num2, answer, operator;
            let isDivision = false;

            // Logic: 
            // Level 1-15: Multiplication (gets harder)
            // Level 16-25: Division (gets harder)
            // Level 26-30: Mix of both

            if (level <= 15) {
                // MULTIPLICATION
                operator = '×';
                if (level <= 3) { num1 = randomInt(1, 3); num2 = randomInt(0, 10); } 
                else if (level <= 6) { num1 = randomInt(4, 5); num2 = randomInt(0, 10); }
                else if (level <= 10) { num1 = randomInt(6, 7); num2 = randomInt(0, 10); }
                else if (level <= 13) { num1 = randomInt(8, 9); num2 = randomInt(0, 10); }
                else { num1 = randomInt(1, 9); num2 = randomInt(0, 10); } // Mix
                answer = num1 * num2;
            } else if (level <= 25) {
                // DIVISION
                isDivision = true;
                operator = ':';
                let divisor;
                if (level <= 18) { divisor = randomInt(1, 3); }
                else if (level <= 21) { divisor = randomInt(4, 5); }
                else if (level <= 23) { divisor = randomInt(6, 7); }
                else { divisor = randomInt(8, 9); }
                
                let quotient = randomInt(1, 10);
                num1 = divisor * quotient; // Dividend
                num2 = divisor;
                answer = quotient;
            } else {
                // MIX (BOSS LEVELS)
                isDivision = Math.random() > 0.5;
                if (isDivision) {
                    operator = ':';
                    let divisor = randomInt(1, 9);
                    let quotient = randomInt(1, 10);
                    num1 = divisor * quotient;
                    num2 = divisor;
                    answer = quotient;
                } else {
                    operator = '×';
                    num1 = randomInt(1, 9);
                    num2 = randomInt(0, 10);
                    answer = num1 * num2;
                }
            }

            // Generate wrong options
            let options = [answer];
            while(options.length < 4) {
                let offset = randomInt(-5, 5);
                if (offset === 0) continue;
                let wrongAns = answer + offset;
                if (wrongAns < 0) wrongAns = Math.abs(wrongAns) + 1;
                if (!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            return {
                text: `${num1} ${operator} ${num2} = ?`,
                answer: answer,
                options: options,
                speechText: isDivision ? `${num1} chia ${num2} bằng mấy?` : `${num1} nhân ${num2} bằng mấy?`
            };
        };

        // --- COMPONENTS ---

        const Header = ({ setView, view }) => (
            <header className="bg-white shadow-sm p-4 sticky top-0 z-10 rounded-b-3xl">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                    <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                        <div className="w-12 h-12 bg-vio text-white rounded-full flex items-center justify-center text-2xl font-bold shadow-md">
                            <i className="fa-solid fa-graduation-cap"></i>
                        </div>
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-vio-dark leading-tight">Toán Học Vui Nhộn</h1>
                            <p className="text-sm text-gray-500 font-semibold">Khang & Khánh</p>
                        </div>
                    </div>
                    {view !== 'home' && (
                        <button 
                            onClick={() => setView('home')}
                            className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-bold transition-colors btn-push shadow-btn"
                        >
                            <i className="fa-solid fa-house mr-2"></i> Trang Chủ
                        </button>
                    )}
                </div>
            </header>
        );

        const SelfStudy = () => {
            const [mode, setMode] = useState('nhan'); // 'nhan' or 'chia'
            const [number, setNumber] = useState(2); // 2-9

            const tableData = [];
            const startIdx = mode === 'nhan' ? 0 : 1; // Bắt đầu từ 0 cho phép nhân, 1 cho phép chia
            for (let i = startIdx; i <= 10; i++) {
                if (mode === 'nhan') {
                    tableData.push({
                        id: i,
                        equation: `${number} × ${i} = ${number * i}`,
                        readText: `${number} nhân ${i} bằng ${number * i}`
                    });
                } else {
                    const dividend = number * i;
                    tableData.push({
                        id: i,
                        equation: `${dividend} : ${number} = ${i}`,
                        readText: `${dividend} chia ${number} bằng ${i}`
                    });
                }
            }

            return (
                <div className="flex-grow p-4 md:p-8 flex flex-col items-center animate-fade-in">
                    <div className="w-full max-w-2xl bg-white rounded-3xl shadow-soft p-6 border-4 border-vio-light">
                        <h2 className="text-2xl md:text-3xl font-bold text-center text-vio-dark mb-6">
                            Bé Tự Học Bảng Cửu Chương
                        </h2>

                        {/* Mode Selector */}
                        <div className="flex justify-center gap-4 mb-6">
                            <button 
                                onClick={() => setMode('nhan')}
                                className={`px-6 py-3 rounded-2xl font-bold text-lg btn-push shadow-btn ${mode === 'nhan' ? 'bg-kid-orange text-white' : 'bg-gray-100 text-gray-500'}`}
                            >
                                Phép Nhân (×)
                            </button>
                            <button 
                                onClick={() => setMode('chia')}
                                className={`px-6 py-3 rounded-2xl font-bold text-lg btn-push shadow-btn ${mode === 'chia' ? 'bg-kid-blue text-white' : 'bg-gray-100 text-gray-500'}`}
                            >
                                Phép Chia (:)
                            </button>
                        </div>

                        {/* Number Selector */}
                        <div className="flex flex-wrap justify-center gap-2 mb-8">
                            {[1,2,3,4,5,6,7,8,9].map(num => (
                                <button
                                    key={num}
                                    onClick={() => setNumber(num)}
                                    className={`w-12 h-12 md:w-14 md:h-14 rounded-full font-bold text-xl btn-push shadow-btn flex items-center justify-center transition-colors
                                        ${number === num ? 'bg-vio text-white' : 'bg-vio-light text-vio-dark hover:bg-green-200'}`}
                                >
                                    {num}
                                </button>
                            ))}
                        </div>

                        {/* Table Display */}
                        <div className="bg-yellow-50 rounded-2xl p-4 md:p-6 border-2 border-yellow-200">
                            <h3 className="text-xl font-bold text-center text-yellow-600 mb-4">
                                Bảng {mode === 'nhan' ? 'Nhân' : 'Chia'} {number}
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {tableData.map(item => (
                                    <div key={item.id} className="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-yellow-100">
                                        <span className="text-xl md:text-2xl font-bold text-gray-700 tracking-wider">
                                            {item.equation}
                                        </span>
                                        <button 
                                            onClick={() => speakText(item.readText)}
                                            className="w-10 h-10 bg-kid-pink text-white rounded-full flex items-center justify-center hover:bg-pink-500 btn-push shadow-btn"
                                            title="Đọc phép tính"
                                        >
                                            <i className="fa-solid fa-volume-high"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const MissionMap = ({ setView, setMission, unlockedMission }) => {
            const totalMissions = 30;
            const missions = Array.from({length: totalMissions}, (_, i) => i + 1);

            const handleLevelClick = (level) => {
                if (level <= unlockedMission) {
                    setMission(level);
                    setView('playing');
                }
            };

            return (
                <div className="flex-grow p-4 md:p-8 flex flex-col items-center">
                    <h2 className="text-3xl md:text-4xl font-bold text-center text-vio-dark mb-2">Hành Trình Thử Thách</h2>
                    <p className="text-gray-600 mb-8 font-semibold text-center">Vượt qua 30 trạm để trở thành Siêu Toán Học!</p>

                    <div className="w-full max-w-4xl map-bg p-6 md:p-10 shadow-soft border-4 border-green-400 relative overflow-hidden">
                        {/* Winding path design (simplified using flex wrap) */}
                        <div className="flex flex-wrap justify-center gap-4 md:gap-8 relative z-10">
                            {missions.map((level) => {
                                const isUnlocked = level <= unlockedMission;
                                const isCurrent = level === unlockedMission;
                                const isPassed = level < unlockedMission;

                                let bgColor = "bg-gray-300";
                                let textColor = "text-gray-500";
                                let shadow = "shadow-btn";
                                let icon = <i className="fa-solid fa-lock text-xl"></i>;

                                if (isPassed) {
                                    bgColor = "bg-vio";
                                    textColor = "text-white";
                                    icon = <i className="fa-solid fa-star text-yellow-300 text-xl"></i>;
                                } else if (isCurrent) {
                                    bgColor = "bg-kid-yellow animate-bounce";
                                    textColor = "text-white";
                                    icon = <span className="text-2xl font-bold">{level}</span>;
                                }

                                return (
                                    <div key={level} className="flex flex-col items-center">
                                        <button 
                                            onClick={() => handleLevelClick(level)}
                                            className={`w-16 h-16 md:w-20 md:h-20 rounded-full border-4 border-white flex items-center justify-center 
                                                ${bgColor} ${textColor} ${isUnlocked ? 'cursor-pointer btn-push shadow-btn' : 'cursor-not-allowed opacity-80'}
                                                transition-all relative`}
                                        >
                                            {isCurrent ? icon : (isPassed ? icon : <span className="text-xl font-bold">{level}</span>)}
                                            
                                            {/* Locked overlay icon if locked */}
                                            {!isUnlocked && (
                                                <div className="absolute inset-0 flex items-center justify-center bg-gray-200/50 rounded-full">
                                                    <i className="fa-solid fa-lock text-gray-500"></i>
                                                </div>
                                            )}
                                        </button>
                                        <span className={`mt-2 font-bold text-sm ${isUnlocked ? 'text-green-800' : 'text-green-600/50'}`}>
                                            Trạm {level}
                                        </span>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const GamePlay = ({ mission, setView, unlockNextLevel }) => {
            const [currentQ, setCurrentQ] = useState(null);
            const [score, setScore] = useState(0);
            const [progress, setProgress] = useState(0); // Max 5 to win
            const [feedback, setFeedback] = useState(null); // 'correct', 'wrong', null
            const [showConfetti, setShowConfetti] = useState(false);
            const targetScore = 5;

            useEffect(() => {
                loadNewQuestion();
            }, []);

            const loadNewQuestion = () => {
                const q = generateQuestionForLevel(mission);
                setCurrentQ(q);
                setFeedback(null);
                speakText(q.speechText);
            };

            const handleAnswer = (selectedOpt) => {
                if (feedback) return; // Prevent multiple clicks

                if (selectedOpt === currentQ.answer) {
                    setFeedback('correct');
                    playSound('correct');
                    const newProgress = progress + 1;
                    setProgress(newProgress);
                    
                    if (newProgress >= targetScore) {
                        // Win level
                        setTimeout(() => {
                            setShowConfetti(true);
                            speakText("Chúc mừng! Khang và Khánh đã qua màn.");
                        }, 500);
                    } else {
                        setTimeout(loadNewQuestion, 1200);
                    }
                } else {
                    setFeedback('wrong');
                    playSound('wrong');
                    speakText("Chưa đúng rồi, thử lại nhé!");
                    setTimeout(() => setFeedback(null), 1000);
                }
            };

            const handleComplete = () => {
                unlockNextLevel(mission);
                setView('missions');
            };

            if (showConfetti) {
                return (
                    <div className="flex-grow flex flex-col items-center justify-center p-4">
                        {/* Simple CSS Confetti */}
                        <div className="fixed inset-0 pointer-events-none overflow-hidden">
                            {Array.from({length: 30}).map((_, i) => (
                                <div key={i} className="confetti-piece" style={{left: `${Math.random()*100}%`, animationDelay: `${Math.random()*3}s`, backgroundColor: ['#f472b6','#38bdf8','#fbbf24','#059669'][i%4]}}></div>
                            ))}
                        </div>
                        
                        <div className="bg-white p-8 rounded-3xl shadow-soft text-center border-4 border-kid-yellow z-10 animate-bounce">
                            <h2 className="text-4xl font-bold text-kid-orange mb-4">Tuyệt Vời! 🎉</h2>
                            <p className="text-xl text-gray-600 mb-6 font-semibold">Các bé đã hoàn thành Trạm {mission}!</p>
                            <img src="https://placehold.co/200x200/fbbf24/ffffff?text=Super+Star" className="mx-auto rounded-full mb-6 shadow-md" alt="Star" />
                            <button 
                                onClick={handleComplete}
                                className="bg-vio hover:bg-vio-dark text-white px-8 py-4 rounded-2xl font-bold text-xl btn-push shadow-btn w-full"
                            >
                                Đi tiếp nào! <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                );
            }

            if (!currentQ) return <div className="flex-grow flex items-center justify-center"><div className="animate-spin text-vio text-4xl"><i className="fa-solid fa-circle-notch"></i></div></div>;

            return (
                <div className="flex-grow flex flex-col items-center p-4 md:p-8">
                    {/* Header Game */}
                    <div className="w-full max-w-2xl flex justify-between items-center mb-6">
                        <button onClick={() => setView('missions')} className="text-gray-500 hover:text-gray-700 w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center btn-push">
                            <i className="fa-solid fa-arrow-left text-xl"></i>
                        </button>
                        <h2 className="text-2xl font-bold text-vio-dark bg-white px-6 py-2 rounded-full shadow-sm border border-green-100">
                            Trạm {mission}
                        </h2>
                        <div className="w-12"></div> {/* Spacer */}
                    </div>

                    {/* Progress Bar */}
                    <div className="w-full max-w-2xl bg-white rounded-full h-6 mb-8 shadow-inner overflow-hidden border border-gray-200 p-1">
                        <div 
                            className="bg-kid-orange h-full rounded-full transition-all duration-500 relative"
                            style={{ width: `${(progress / targetScore) * 100}%` }}
                        >
                            <div className="absolute right-2 top-0 h-full flex items-center text-white text-xs font-bold">
                                {progress}/{targetScore}
                            </div>
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="w-full max-w-2xl bg-white rounded-3xl shadow-soft p-8 md:p-12 border-b-8 border-vio-light text-center relative">
                        {/* Audio Button */}
                        <button 
                            onClick={() => speakText(currentQ.speechText)}
                            className="absolute top-4 right-4 text-kid-blue hover:text-blue-600 bg-blue-50 p-3 rounded-full btn-push"
                        >
                            <i className="fa-solid fa-volume-high text-xl"></i>
                        </button>

                        <h3 className="text-6xl md:text-8xl font-black text-gray-800 tracking-widest mb-10 py-6">
                            {currentQ.text}
                        </h3>

                        {/* Options Grid */}
                        <div className="grid grid-cols-2 gap-4 md:gap-6">
                            {currentQ.options.map((opt, idx) => {
                                let btnColor = "bg-gray-100 hover:bg-gray-200 text-gray-800 border-b-4 border-gray-300";
                                if (feedback === 'correct' && opt === currentQ.answer) {
                                    btnColor = "bg-green-500 text-white border-b-4 border-green-700 scale-105";
                                } else if (feedback === 'wrong') {
                                    btnColor = "bg-red-400 text-white border-b-4 border-red-600 opacity-50";
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(opt)}
                                        disabled={feedback !== null}
                                        className={`text-3xl md:text-4xl font-bold py-6 md:py-8 rounded-2xl transition-all duration-200 shadow-sm
                                            ${btnColor} ${feedback === null ? 'btn-push' : ''}`}
                                    >
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                        
                        {/* Feedback Overlay */}
                        {feedback === 'correct' && (
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="bg-white/90 rounded-full p-4 animate-bounce">
                                    <i className="fa-solid fa-check-circle text-6xl text-green-500 shadow-sm rounded-full bg-white"></i>
                                </div>
                            </div>
                        )}
                        {feedback === 'wrong' && (
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="bg-white/90 rounded-full p-4 animate-pulse">
                                    <i className="fa-solid fa-xmark-circle text-6xl text-red-500 shadow-sm rounded-full bg-white"></i>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home'); // 'home', 'study', 'missions', 'playing'
            const [unlockedMission, setUnlockedMission] = useState(1);
            const [currentMission, setCurrentMission] = useState(1);

            // Load progress on startup
            useEffect(() => {
                const saved = localStorage.getItem('khangKhanhMathProgress');
                if (saved) {
                    setUnlockedMission(parseInt(saved, 10));
                }
            }, []);

            // Save progress
            const unlockNextLevel = (completedLevel) => {
                const nextLevel = completedLevel + 1;
                if (nextLevel > unlockedMission && nextLevel <= 30) {
                    setUnlockedMission(nextLevel);
                    localStorage.setItem('khangKhanhMathProgress', nextLevel);
                }
            };

            return (
                <div className="flex flex-col h-full w-full relative">
                    <Header setView={setView} view={view} />

                    {/* Main Content Area */}
                    <main className="flex-grow flex flex-col relative z-0">
                        {view === 'home' && (
                            <div className="flex-grow flex flex-col items-center justify-center p-6 text-center">
                                <h1 className="text-3xl md:text-5xl font-black text-vio-dark mb-4 animate-bounce">
                                    Chào Nguyên Khang <br/>& Hoàng Khánh!
                                </h1>
                                <p className="text-lg md:text-xl text-gray-600 mb-12 font-semibold">
                                    Cùng nhau chinh phục Toán học nào!
                                </p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                                    <button 
                                        onClick={() => setView('study')}
                                        className="bg-white border-4 border-kid-blue rounded-3xl p-8 flex flex-col items-center btn-push shadow-soft hover:bg-blue-50 transition-colors group"
                                    >
                                        <div className="w-24 h-24 bg-blue-100 text-kid-blue rounded-full flex items-center justify-center text-4xl mb-4 group-hover:scale-110 transition-transform">
                                            <i className="fa-solid fa-book-open-reader"></i>
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800">Bé Tự Học</h2>
                                        <p className="text-gray-500 font-medium mt-2">Nghe và đọc theo bảng cửu chương</p>
                                    </button>

                                    <button 
                                        onClick={() => setView('missions')}
                                        className="bg-white border-4 border-kid-orange rounded-3xl p-8 flex flex-col items-center btn-push shadow-soft hover:bg-orange-50 transition-colors group"
                                    >
                                        <div className="w-24 h-24 bg-orange-100 text-kid-orange rounded-full flex items-center justify-center text-4xl mb-4 group-hover:scale-110 transition-transform">
                                            <i className="fa-solid fa-gamepad"></i>
                                        </div>
                                        <h2 className="text-2xl font-bold text-gray-800">Thử Thách</h2>
                                        <p className="text-gray-500 font-medium mt-2">Vượt qua 30 trạm Toán học</p>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'study' && <SelfStudy />}
                        {view === 'missions' && <MissionMap setView={setView} setMission={setCurrentMission} unlockedMission={unlockedMission} />}
                        {view === 'playing' && <GamePlay mission={currentMission} setView={setView} unlockNextLevel={unlockNextLevel} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
